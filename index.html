<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Spell List | Runiformity's Websites</title>
  <meta name="description" content="A tool for searching and viewing spells, with advanced filtering and spellbook capabilities.">
  <meta name="author" content="runiformity173">
  <link href="/bootstrap.css" rel="stylesheet" type="text/css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="view/fonts.css" rel="stylesheet" type="text/css" />
  <link href="view/spell.css" rel="stylesheet" type="text/css" />
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>

<body onload="load();">
  <div class="container-fluid p-4 vh-100 text-light">
    <div class="row g-4 h-100">

      <!-- Spell list -->
      <div class="col-12 col-lg-8 h-100">
        <div class="card shadow-sm h-100 bg-dark">
          <div class="card-body h-100">
            <div class="input-group">
              
              <input
                type="search"
                name="search"
                class="form-control bg-dark border-bottom-0"
                id="spellSearchbar"
                placeholder="Search spells..."
                oninput="SEARCH_QUERY = this.value;filterSpells();"
              >
              <span class="input-group-text p-0 bg-dark text-light border-bottom-0 position-absolute end-0 h-100 cursor-pointer" id="magnifyingGlass">
                <label for="spellSearchbar" class="w-100 cursor-pointer">
                  <div style="-webkit-transform: rotate(45deg); 
                                -moz-transform: rotate(45deg); 
                                  -o-transform: rotate(45deg);
                                      transform: rotate(45deg);
                                      font-size: 150%;
                                      pointer-events: none;">
                      &#9906;
                  </div>
                </label>
              </span>
            </div>
            <div class="border rounded p-3 mb-3">
              <div class="d-flex justify-content-between align-items-center inline-section-label">
                <!-- <button class="btn btn-sm btn-outline-light">
                  Edit Advanced Filters
                </button> -->
                <div class="d-flex flex-wrap gap-2" id="spellFiltersContainer">&#8203;</div>
              </div>

              
            </div>

            <!-- Spell list -->
            <div class="border rounded overflow-auto flex-grow-1 position-relative overflow-hidden d-flex flex-column" style="height: 600px;" id="spellListContainer">
              <div class="list-group-item bg-dark text-light" id="spellListHeaders">
                <div class="row align-items-center g-2 text-secondary">
                  <div class="col-5 fw-semibold">Name</div>
                  <div class="col-2">Level</div>
                  <div class="col-4">School</div>
                  <div class="col-1">Source</div>
                </div>
              </div>
              <div class="list-group list-group-flush overflow-auto" id="spellOptions">
                
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- Spell display -->
      <div class="col-12 col-lg-4 h-100">
        <div class="card shadow-sm h-100 text-dark overflow-auto bg-dark">
          <div class="card-body">
            <div id="spellOutput">
              <div class="spell-display">

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="filterModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark text-light">
        <div class="modal-header">
          <h5 class="modal-title">Filter</h5>
          <button type="button" class="close-button" data-bs-dismiss="modal">
            <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
              <path d="M2.146 2.146a.5.5 0 0 1 .708 0L8 7.293l5.146-5.147a.5.5 0 0 1
                .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8
                8.707l-5.146 5.147a.5.5 0 1 1-.708-.708L7.293 8
                2.146 2.854a.5.5 0 0 1 0-.708z"></path>
            </svg>
          </button>
        </div>
        <div class="modal-body text-center">

        </div>
      </div>
    </div>
  </div>
  <script src="/bootstrap.js"></script>
  <script src="data.js"></script>
  <script src="view/displaySpell.js"></script>
  <script src="script.js"></script>
  <script src="filters.js"></script>
  <script src="saving.js"></script>
</body>
</html>
